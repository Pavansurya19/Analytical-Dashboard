<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Menu | Meghana Foods</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <body>
  <div id="cursor-dot"></div>
  <div id="cursor-ring"></div>
  
  <!-- Rest of your HTML -->
  <nav class="navbar">
    <a href="index.html" class="nav-brand">Meghana Foods</a>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="dashboard.html">Dashboard</a></li>
      <li><a href="mining.html">Text Mining</a></li>
      <li><a href="menu.html" class="active">Menu & Reviews</a></li>
    </ul>
  </nav>

  <div class="page-wrapper">
    <div class="container">
      <div class="page-header reveal">
        <h1>Our Signature Menu</h1>
        <p>Explore our most-loved dishes with live customer ratings.</p>
      </div>

      <!-- MENU GRID -->
      <div class="grid-4 reveal" id="menu-grid" style="margin-bottom: 60px;">
        <!-- Populated by JS -->
      </div>

      <!-- REVIEW FORM -->
      <div class="review-section card reveal">
        <h3 class="chart-title" style="text-align: center; border: none;">Leave a Review</h3>
        <p style="text-align: center; color: var(--text-muted); margin-bottom: 30px;">Your feedback helps us improve.</p>
        
        <form id="review-form">
          <div class="form-group">
            <label>Your Name</label>
            <input type="text" class="form-control" placeholder="e.g. Priya Sharma" required>
          </div>
          <div class="form-group">
            <label>Select Dish</label>
            <select class="form-control" required>
              <option value="">Choose a dish...</option>
              <option value="Boneless Chicken Biryani">Boneless Chicken Biryani</option>
              <option value="Paneer Biryani">Paneer Biryani</option>
              <option value="Chicken 555">Chicken 555</option>
            </select>
          </div>
          <div class="form-group">
            <label>Branch</label>
            <select class="form-control" required>
              <option value="">Select branch...</option>
              <option value="Jayanagar">Jayanagar</option>
              <option value="Koramangala">Koramangala</option>
              <option value="Indiranagar">Indiranagar</option>
            </select>
          </div>
          <div class="form-group">
            <label>Overall Sentiment</label>
            <select class="form-control" required>
              <option value="Positive">Positive</option>
              <option value="Negative">Negative</option>
            </select>
          </div>
          <div class="form-group">
            <label>Your Review</label>
            <textarea class="form-control" placeholder="Tell us about your experience..." required></textarea>
          </div>
          <button type="submit" class="btn btn-primary" style="width: 100%;">Submit Review</button>
        </form>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
